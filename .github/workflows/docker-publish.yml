name: Docker Publish (patched)

# Fork-only workflow, added by the release-sync automation. Builds and pushes
# the patched Bambuddy image (keep_file_on_sd, issue maziggy/bambuddy#3009) to
# ghcr.io on tags like v1.2.5.7-patched. Upstream ships no publish workflow —
# maziggy publishes by hand — so this file exists only on the `patched` line
# and its build branches. It re-adds itself on every sync commit.

on:
  push:
    tags:
      - 'v*-patched'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-patched-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image tags
        id: tags
        run: |
          # GITHUB_REF_NAME is e.g. v1.2.5.7-patched -> 1.2.5.7-patched
          VER="${GITHUB_REF_NAME#v}"
          if [ -z "$VER" ] || [ "$VER" = "$GITHUB_REF_NAME" ]; then
            VER="${GITHUB_REF_NAME##*/}"  # manual dispatch: any ref name
          fi
          echo "version=${VER,,}" >> "$GITHUB_OUTPUT"

      # arm64 (RPi / Apple Silicon) via QEMU; amd64 native.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.tags.outputs.version }}
            ghcr.io/${{ github.repository }}:patched-latest
          cache-from: type=gha,scope=bambuddy-patched
          cache-to: type=gha,mode=max,scope=bambuddy-patched
